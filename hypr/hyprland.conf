# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ HYPRLAND MAIN CONFIGURATION (CLEAN & SECURE SPECIFICATION)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 1. MATIKAN PENANDA GENERATOR OTOMATIS (Wajib diubah dari 1 ke 0 agar sistem mau memuat desktop)
autogenerated = 0

# 2. PENGATURAN MONITOR & REFRESH RATE (Mengunci 180Hz secara mutlak pada port DP-3)

# 3. MANAJEMEN DEKORASI & INTEGRASI SCREEN SHADER AMOLED (Formula Intel/NVIDIA Safe-Compliant)
decoration {
    screen_shader = /home/alimzicus/.config/hypr/shaders/amoled.frag
    rounding = 14
    rounding_power = 3.0
    
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

# 4. DEFINISI VARIABEL APLIKASI UTAMA
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

# 5. PEMETAAN TOMBOL PINTASAN HARIAN (Keybindings)
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

# Pintasan cepat untuk me-reload konfigurasi manual (SUPER + SHIFT + C)
bind = $mainMod SHIFT, C, exec, hyprctl reload

